name: Sync Daily Data

on:
  schedule:
    # Todos los días a las 10:00 UTC (12:00 hora española en invierno, 13:00 en verano)
    # A esta hora ya han terminado los partidos NBA de la noche americana
    - cron: "0 10 * * *"
  workflow_dispatch:

jobs:
  sync-daily:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ingestion

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync upcoming games (recent + future)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
        run: python -m src.jobs.sync_upcoming_games

      # Las tres fuentes de la pestaña de Novedades. Son una peticion HTTP
      # cada una y ninguna depende de las demas, asi que van seguidas: si
      # una fuente falla, el hilo se queda sin esa parte pero no sin las
      # otras.
      - name: Sync injuries (ESPN)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.jobs.sync_injuries
        continue-on-error: true

      - name: Sync transactions (NBA)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.jobs.sync_transactions
        continue-on-error: true

      - name: Sync news (ESPN Deportes)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.jobs.sync_news
        continue-on-error: true

      # - name: Sync finalized games
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      #   run: python -m src.jobs.sync_games

      # - name: Sync box scores
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      #     SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      #   run: python -m src.jobs.sync_box_scores


name: Sync Scores

on:
  schedule:
    - cron: "*/15 22-23 * * *"
    - cron: "*/15 0-7 * * *"
    - cron: "0 8-21/2 * * *"
  workflow_dispatch:

concurrency:
  group: sync-scores
  cancel-in-progress: false

jobs:
  sync-scores:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: services/ingestion

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: services/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync schedule and results
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.jobs.sync_upcoming_games --days-back 3 --days-ahead 30

      - name: Sync box scores
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.jobs.sync_box_scores --include-preseason

      - name: Sync starting lineups
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m src.jobs.sync_starters
